# Löptexter på sidan. Fetstil skrivs **så här**.

hero_etikett: Lars Winnerbäcks Stiftelse · Linköping
hero_rubrik: Kulturpriset
hero_rubrik_vit: Nyponet
hero_text: Lars Winnerbäcks Stiftelse har till uppgift att främja kulturlivet i Linköpings kommun.
stipendiater: Utdelning av stipendium ur Lars Winnerbäcks Stiftelse sker årligen vid en ceremoni som är öppen för allmänheten. Fram till ceremonin är stipendiaten hemlig. Stipendiaten utses av stiftelsens styrelse, och stipendiet går inte att söka.
arkiv_intro: Nedan listas tidigare stipendiater och motiveringar.
stiftelsen: Lars Winnerbäcks Stiftelse har till uppgift att främja kulturlivet i Linköpings kommun.
stiftelsen_stor: Det sker genom att stiftelsen varje år delar ut ett stipendium på **100 000:-** till en eller flera **eldsjälar** som bidrar till att berika kulturlivet i Linköping.
stiftelsen_spalter:
  - Stipendiaten, eller stipendiaterna, får också ett nypon tillverkat av en hantverkare som är verksam i eller har koppling till Östergötland.
  - Det första stipendiet delades ut på Linköping Konsert & Kongress i mars 2016.
hantverkare: Stipendiaten får förutom pengar ett specialdesignat pris i form av ett nypon. Den hantverkare som tillverkar priset har fria händer att utifrån sitt eget material och formspråk göra sin tolkning av ett nypon.
