  bild_alt: Nyponpriset 2025
  text: Nyponpriset för år 2025 är ett linoliumtryck inspirerat av det svarta nyponet från pimpinellrosen tillverkat av [Sandy Harry Ceesay](https://www.albertbonniersforlag.se/forfattare/65281/sandy-harry-ceesay/).
  foto: "Foto: Sandy Harry Ceesay"
- ar: 2024
